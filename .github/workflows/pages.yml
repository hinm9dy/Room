name: Publish Room
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prepare and verify Room
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64, hashlib, json, urllib.request
          
          target = Path('site')
          target.mkdir(exist_ok=True)
          (target / 'index.html').write_bytes(base64.b64decode(''))
          (target / '.nojekyll').write_text('')
          files = json.loads('{"app.js": "05fbeb1b63c774b5cc28eee089fc97b2cdda2082d77daaffd2983a3fa194b4de", "assets/olive-doodle-actions-burgundy.png": "b6c0b1ffcad6d48fceddc006982f32855252ed69257f5b86617c4140e9862d56", "assets/olive-doodle-actions-red.png": "6edd297b3d1f5a74d4013ebbdd3e9f6f14f4bfdd82d599ea59c512b1167acb57", "assets/olive-doodle-actions.png": "f6c38f5da22a0c682bf9b69266850ff6223f905e9184a36eb313506a5c7784a6", "assets/olive-doodle-walk.png": "65f372e869b889d2fdbd166d6b05323f23ca9c0e381715a26eb333c84d8c3328", "assets/olive-extra.png": "f8732d2c04d9617a3eee5bcfd70a181f534615eec5e6314a14f111dd3339476b", "assets/olive-illustrated.png": "f770c927936be97bd36d1606713da837ccd83603f4409e010881a63025b45bd6", "assets/olive-walk.png": "b8a825e828922d8c9baac67a2a9bcf8872ae4ca47b1bc1cf1c090983aeb4a0e4", "assets/red-paper.png": "7f14455c43f2ba9757238f7570c9e9ce1facedfc515df9c17bc664cfdfbd9b4f", "behavior.js": "b48c559430da745ea29200f59bbab8e087eb0446a25e961c92419664b8f6ff50", "dice.js": "713e6ac67378d61523dc06971e12f076294c304eb48f8cca232e17af7fe254a1", "marks.js": "d7244dd39eabc077515ea5304d3cfdcf467b6e0dc80aaa3cbbaad1043006ea2c", "motion.js": "a57da36f18453f119efdef717676da0e0d087523648474e1dfab3e3f1eb6bd9c", "poses.js": "5a4ce2f3df4b0291f1d2e85f68ebd2ae71011c2c200cc79bc23ed2d57e0daec3", "style.css": "4efbab9480f7cb762df8af0b02c44764e3f32f0f99364cb6de6d7d81cf9402c4"}')
          origin = 'https://olive-ash-quiet-room.candidgrove16.chatgpt.site/'
          for name, expected in files.items():
              request = urllib.request.Request(origin + name, headers={'User-Agent': 'Room-Pages-Publisher'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = response.read()
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise RuntimeError('Source changed; refusing to publish: ' + name)
              output = target / name
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_bytes(data)
              print('Verified ' + name)
          print('Room is ready with 17 standalone files.')
          PY
      - name: Upload Room
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          include-hidden-files: true
      - name: Publish Room
        id: deployment
        uses: actions/deploy-pages@v4
